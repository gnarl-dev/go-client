name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, against whatever node was released most recently. A client can
  # break without a commit here: the node moves, and the only way to notice is
  # to keep asking it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  unit:
    name: unit + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # The floor go.mod declares, so a 1.24 caller is what CI proves works.
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - name: gofmt
        run: |
          # The generated layer is excluded: it is gofmt'd by the generator,
          # and reformatting it by hand would be undone on the next run.
          unformatted=$(gofmt -l . | grep -v '^internal/oas/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./... -race

  conformance:
    # The layer that matters. Compiling proves the types match the
    # description; only this proves the description matches the server.
    #
    # The node comes from the PUBLIC gnarl-dev/releases, which this workflow's
    # own token can read. This job used to download from lucenia/lucenia — an
    # internal repository — behind a LUCENIA_RELEASE_TOKEN secret that was
    # never set, so it skipped on every run since it was written and the
    # suite that talks to a server had never once run in CI.
    name: conformance against a released node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Fetch the latest released node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo gnarl-dev/releases --json tagName -q .tagName)
          echo "using $tag"
          echo "### Conformance node: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p node && cd node
          gh release download "$tag" --repo gnarl-dev/releases \
            --pattern 'gnarl-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'SHA256SUMS.txt'
          # Check the archive against the release's own checksums before
          # running anything from it.
          grep ' ./gnarl-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt \
            | sed 's# \./# #' | sha256sum -c -
          tar xzf gnarl-x86_64-unknown-linux-gnu.tar.gz
          # The binary is `gnarl`; it runs JVM-free on the native engine, so
          # no Java is needed. Its ONNX runtime libraries ship beside it.
          echo "GNARL_BINARY=$PWD/gnarl" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Conformance
        run: go test ./conformance/... -v -count=1

  spec-drift:
    # The generated layer must match the description it claims to come from.
    # A hand-edit here is how a client silently stops matching the server.
    name: generated layer is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolsgo
        run: echo "version=$(awk '$1=="go"{print $2; exit}' tools.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        # tools.mod, not go.mod: the pinned generator needs a newer Go than
        # the client does. Regenerating with `@latest` made this check depend
        # on whatever oapi-codegen shipped that morning, so a green run proved
        # nothing about the version that produced the checked-in code.
        # setup-go parses a version out of a file only when it is named
        # go.mod; any other file is read as a bare version string. So the
        # `go` directive is read from tools.mod here.
        with: { go-version: "${{ steps.toolsgo.outputs.version }}" }
      - name: Regenerate and diff
        run: |
          go generate ./internal/oas
          if ! git diff --exit-code -- internal/oas/oas.gen.go; then
            echo
            echo "internal/oas/oas.gen.go does not match openapi.yaml."
            echo "It is generated — edit the spec and run: go generate ./internal/oas"
            exit 1
          fi

  spec-freshness:
    # The OTHER half of spec-drift.
    #
    # `spec-drift` proves the generated layer matches the VENDORED
    # description, and says nothing about whether the vendored copy matches
    # the server. A client can be perfectly self-consistent and perfectly
    # stale — this one was, and the cost was a generated layer with no
    # `FanOutProfile` and no `ClaimRoute` months after the server sent them.
    #
    # The server's description lives in an internal repository, so an exact
    # diff needs a token this workflow does not have. What a released node
    # CAN answer without one is whether every operation the vendored copy
    # declares is actually routed — which catches this client describing, and
    # wrapping, an operation the node does not have.
    #
    # Not a substitute for the exact diff: a route the server ADDED and the
    # vendored copy lacks is invisible here. The exact diff runs too when a
    # LUCENIA_RELEASE_TOKEN secret is present.
    name: vendored description is served
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - name: Fetch the latest released node
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo gnarl-dev/releases --json tagName -q .tagName)
          echo "using $tag"
          mkdir -p node && cd node
          gh release download "$tag" --repo gnarl-dev/releases \
            --pattern 'gnarl-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'SHA256SUMS.txt'
          grep ' ./gnarl-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt \
            | sed 's# \./# #' | sha256sum -c -
          tar xzf gnarl-x86_64-unknown-linux-gnu.tar.gz
          echo "GNARL_BINARY=$PWD/gnarl" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Every described route is served
        run: go test ./conformance/... -v -count=1 -run TestEveryDescribedRouteIsServed

      - name: Exact diff against the server's description (needs a token)
        env:
          TOKEN: ${{ secrets.LUCENIA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            {
              echo "### Exact spec diff skipped"
              echo
              echo "No \`LUCENIA_RELEASE_TOKEN\`, so the vendored description was"
              echo "checked against a released node's routes only, not diffed"
              echo "against lucenia/lucenia main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$TOKEN" gh api repos/lucenia/lucenia/contents/rust/api/openapi.yaml \
            --jq '.content' | base64 -d > /tmp/upstream.yaml
          if ! diff -u /tmp/upstream.yaml internal/oas/openapi.yaml; then
            echo
            echo "::error::internal/oas/openapi.yaml is not the server's"
            echo "current description. Re-vendor it and run"
            echo "\`go generate ./internal/oas\`. A stale contract is how a"
            echo "generated client goes on describing an API the server no"
            echo "longer has."
            exit 1
          fi
          echo "vendored description matches lucenia/lucenia main"
